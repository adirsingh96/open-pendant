name: openpendant
description: OpenPendant phone host — BLE PCM, OpenAI STT, local clips
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.8
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.2
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  url_launcher: ^6.3.2
  sherpa_onnx: ^1.13.7
  record: ^7.1.1
  lucide_icons_flutter: ^3.1.17
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
